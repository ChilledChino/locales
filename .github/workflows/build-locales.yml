name: Build and validate locales

on:
  pull_request:
    paths:
      - "locales.json"
      - "src/**"
      - "scripts/build.py"
      - ".github/workflows/build-locales.yml"
  push:
    branches: [master]
    paths:
      - "locales.json"
      - "src/**"
      - "scripts/build.py"
      - ".github/workflows/build-locales.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate and build dist bundles
        run: python scripts/build.py

      - name: Verify clean build on pull request
        if: github.event_name == 'pull_request'
        run: python scripts/build.py --check

      - name: Commit dist bundles on master
        if: github.event_name != 'pull_request'
        run: |
          if git diff --quiet dist/; then
            echo "dist/ already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dist/
          git commit -m "chore: rebuild locale bundles"
          git push
